<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>EZ Vault</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <path class="logo-shield" d="M32 4 L56 12 V30 C56 45 46 55 32 60 C18 55 8 45 8 30 V12 Z"/>
        <path class="logo-ez" d="M29 21 H19 V43 H29 M19 32 H27 M33 21 H45 L33 43 H45"/>
      </svg>
      <span class="brand-name">EZ <b>VAULT</b></span>
      <span class="brand-by">by EZGGco</span>
    </div>
    <button class="tb-update hidden" id="tb-update" title="An update is ready"></button>
    <div class="titlebar-status" id="tb-status"></div>
    <div class="win-controls">
      <button class="win-btn" id="win-min" title="Minimize" aria-label="Minimize"></button>
      <button class="win-btn" id="win-max" title="Maximize" aria-label="Maximize"></button>
      <button class="win-btn win-close" id="win-close" title="Close" aria-label="Close"></button>
    </div>
  </header>

  <main id="lock" class="screen"></main>

  <main id="app" class="screen hidden">
    <aside class="sidebar" id="sidebar"></aside>
    <section class="list-pane" id="list-pane"></section>
    <section class="detail-pane" id="detail-pane"></section>
    <section class="tool-pane hidden" id="tool-pane"></section>
  </main>

  <div id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script src="strength.js"></script>
  <script src="app.js"></script>
</body>
</html>
